name: Go CI
on:
    push: 
        branches: ["master"]
    pull_request:
        branches: ["master"]
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Set Up Go
              uses: actions/setup-go@v5
              with: 
                go-version: 1.22
            - name: Build the Application
              run: go build -v main.go
            - name: Run Tests
              run: go test -v ./...
